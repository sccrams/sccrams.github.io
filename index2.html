<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cricket Database v1.5</title>

<script src="https://cdn.jsdelivr.net

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f5f5f5;
}

h1{
    margin-bottom:10px;
}

.version{
    background:#d62828;
    color:white;
    padding:4px 10px;
    border-radius:5px;
    font-size:14px;
}

#status{
    margin:15px 0;
    padding:10px;
    border-radius:5px;
    font-weight:bold;
}

.success{
    background:#d4edda;
    color:#155724;
}

.error{
    background:#f8d7da;
    color:#721c24;
}

.card{
    display:inline-block;
    background:white;
    padding:15px;
    margin:5px;
    border-radius:10px;
    box-shadow:0 2px 5px #ccc;
    width:180px;
}

input{
    padding:10px;
    width:300px;
    margin:10px 0;
}

select{
    padding:10px;
    margin-right:10px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:10px;
}

th{
    background:#7b1831;
    color:white;
    cursor:pointer;
}

th,td{
    padding:10px;
    border:1px solid #ddd;
}

tr:hover{
    background:#f0f8ff;
}

#recordCount{
    margin-top:10px;
    font-weight:bold;
}

#popup{
    display:none;
    position:fixed;
    top:20%;
    left:50%;
    transform:translateX(-50%);
    width:320px;
    background:white;
    border:2px solid #333;
    padding:20px;
    box-shadow:0 0 20px #333;
    z-index:1000;
}

.chartContainer{
    background:white;
    margin:20px 0;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 5px #ccc;
}

#footer{
    position:fixed;
    right:10px;
    bottom:10px;
    background:#222;
    color:white;
    padding:8px 12px;
    border-radius:5px;
    font-family:monospace;
}

button{
    cursor:pointer;
}

</style>

</head>

<body>

<h1>
    Cricket Player Database
    <span class="version">v1.5</span>
</h1>

<div id="status">
    Loading players.json...
</div>

<div id="stats"></div>

<div>

    <select id="teamFilter">
        <option value="">All Teams</option>
        <option value="1st XI">1st XI</option>
        <option value="2nd XI">2nd XI</option>
        <option value="3rd XI">3rd XI</option>
    </select>

    <input
        type="text"
        id="search"
        placeholder="Search name, team, runs, wickets">

</div>

<div id="recordCount"></div>

<div class="chartContainer">
    <h2>Top 10 Run Scorers</h2>
    <canvas id="runsChart"></canvas>
</div>

<div class="chartContainer">
    <h2>Top 10 Wicket Takers</h2>
    <canvas id="wicketsChart"></canvas>
</div>

<div class="chartContainer">
    <h2>Players Per Team</h2>
    <canvas id="teamChart"></canvas>
</div>

<table id="playersTable"></table>

<div id="popup"></div>

<div id="footer">
    CricketDB v1.5
</div>

<script>

const VERSION = "1.5";

let players = [];
let filteredPlayers = [];
let sortAscending = true;

let runsChart = null;
let wicketsChart = null;
let teamChart = null;

document
    .getElementById("search")
    .addEventListener("input", filterPlayers);

document
    .getElementById("teamFilter")
    .addEventListener("change", filterPlayers);

fetch("players.json")

.then(response => {

    if(!response.ok){
        throw new Error(
            `players.json not found (HTTP ${response.status})`
        );
    }

    return response.json();

})

.then(data => {

    if(!Array.isArray(data)){
        throw new Error(
            "JSON loaded but root object is not an array"
        );
    }

    players = data;
    filteredPlayers = [...players];

    document.getElementById("status").className =
        "success";

    document.getElementById("status").innerHTML =
        `✅ Loaded ${players.length} players`;

    buildStats();
    renderTable(players);

    buildRunsChart();
    buildWicketsChart();
    buildTeamChart();

})

.catch(error => {

    document.getElementById("status").className =
        "error";

    document.getElementById("status").innerHTML =

        `❌ ${error.message}`;

    console.error(error);

});

function buildStats(){

    const totalRuns =
        players.reduce((a,b)=>a+b.runs,0);

    const totalWickets =
        players.reduce((a,b)=>a+b.wickets,0);

    const topScorer =
        players.reduce((a,b)=>
            a.runs > b.runs ? a : b);

    document.getElementById("stats").innerHTML =

    `
    <div class="card">
        <h3>Players</h3>
        ${players.length}
    </div>

    <div class="card">
        <h3>Total Runs</h3>
        ${totalRuns}
    </div>

    <div class="card">
        <h3>Total Wickets</h3>
        ${totalWickets}
    </div>

    <div class="card">
        <h3>Top Scorer</h3>
        ${topScorer.name}
    </div>
    `;
}

function renderTable(data){

    document.getElementById("recordCount").innerHTML =
        `${data.length} player(s) found`;

    let html = `
    <tr>
        <th onclick="sortBy('name')">Name</th>
        <th onclick="sortBy('team')">Team</th>
        <th onclick="sortBy('runs')">Runs</th>
        <th onclick="sortBy('wickets')">Wickets</th>
        <th>Profile</th>
    </tr>`;

    data.forEach(player => {

        html += `
        <tr>
            <td>${player.name}</td>
            <td>${player.team}</td>
            <td>${player.runs}</td>
            <td>${player.wickets}</td>
            <td>
                <button onclick="showPlayer(${player.id})">
                    View
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("playersTable").innerHTML =
        html;
}

function filterPlayers(){

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const team =
        document.getElementById("teamFilter")
        .value;

    filteredPlayers = players.filter(player => {

        const searchMatch =

            player.name.toLowerCase().includes(search) ||
            player.team.toLowerCase().includes(search) ||
            player.runs.toString().includes(search) ||
            player.wickets.toString().includes(search);

        const teamMatch =
            team === "" ||
            player.team === team;

        return searchMatch && teamMatch;
    });

    renderTable(filteredPlayers);
}

function sortBy(column){

    sortAscending = !sortAscending;

    filteredPlayers.sort((a,b)=>{

        if(typeof a[column] === "string"){

            return sortAscending
                ? a[column].localeCompare(b[column])
                : b[column].localeCompare(a[column]);
        }

        return sortAscending
            ? a[column] - b[column]
            : b[column] - a[column];

    });

    renderTable(filteredPlayers);
}

function showPlayer(id){

    const p =
        players.find(x => x.id === id);

    document.getElementById("popup").innerHTML =

    `
    <h2>${p.name}</h2>

    <p><b>Team:</b> ${p.team}</p>
    <p><b>Runs:</b> ${p.runs}</p>
    <p><b>Wickets:</b> ${p.wickets}</p>

    <button onclick="closePopup()">
        Close
    </button>
    `;

    document.getElementById("popup").style.display =
        "block";
}

function closePopup(){

    document.getElementById("popup").style.display =
        "none";
}

function buildRunsChart(){

    const top10 =
        [...players]
        .sort((a,b)=>b.runs-a.runs)
        .slice(0,10);

    runsChart = new Chart(

        document.getElementById("runsChart"),

        {
            type:"bar",

            data:{
                labels:
                    top10.map(p=>p.name),

                datasets:[{
                    label:"Runs",
                    data:
                        top10.map(p=>p.runs),

                    backgroundColor:"#7b1831"
                }]
            }
        }
    );
}

function buildWicketsChart(){

    const top10 =
        [...players]
        .sort((a,b)=>b.wickets-a.wickets)
        .slice(0,10);

    wicketsChart = new Chart(

        document.getElementById("wicketsChart"),

        {
            type:"bar",

            data:{
                labels:
                    top10.map(p=>p.name),

                datasets:[{
                    label:"Wickets",
                    data:
                        top10.map(p=>p.wickets),

                    backgroundColor:"#00509d"
                }]
            }
        }
    );
}

function buildTeamChart(){

    const first =
        players.filter(
            p=>p.team==="1st XI"
        ).length;

    const second =
        players.filter(
            p=>p.team==="2nd XI"
        ).length;

    const third =
        players.filter(
            p=>p.team==="3rd XI"
        ).length;

    teamChart = new Chart(

        document.getElementById("teamChart"),

        {
            type:"pie",

            data:{
                labels:[
                    "1st XI",
                    "2nd XI",
                    "3rd XI"
                ],

                datasets:[{

                    data:[
                        first,
                        second,
                        third
                    ],

                    backgroundColor:[
                        "#7b1831",
                        "#00509d",
                        "#6c757d"
                    ]
                }]
            }
        }
    );
}

console.log(
    "Cricket Database Version",
    VERSION
);

</script>

</body>
</html>
