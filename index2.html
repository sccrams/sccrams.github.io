<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cricket Database v1.6</title>

<script src="https:r.net/npm/chart.js

<style>

body{
    font-family:Arial,sans-serif;
    margin:20px;
    background:#f5f5f5;
}

.version{
    background:#d62828;
    color:white;
    padding:4px 10px;
    border-radius:5px;
}

#status{
    padding:10px;
    margin:15px 0;
    border-radius:5px;
    font-weight:bold;
}

.success{
    background:#d4edda;
    color:#155724;
}

.error{
    background:#f8d7da;
    color:#721c24;
}

.card{
    display:inline-block;
    width:180px;
    margin:5px;
    padding:15px;
    background:white;
    border-radius:10px;
    box-shadow:0 2px 5px #ccc;
}

input,select{
    padding:10px;
    margin:5px;
}

input{
    width:300px;
}

button{
    padding:8px 12px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:10px;
}

th{
    background:#7b1831;
    color:white;
    cursor:pointer;
}

th,td{
    padding:10px;
    border:1px solid #ddd;
}

tr:hover{
    background:#f0f8ff;
}

.chartContainer{
    background:white;
    padding:15px;
    margin:20px 0;
    border-radius:10px;
    box-shadow:0 2px 5px #ccc;
}

#popup{
    display:none;
    position:fixed;
    top:20%;
    left:50%;
    transform:translateX(-50%);
    background:white;
    width:320px;
    padding:20px;
    border:2px solid #333;
    box-shadow:0 0 20px #333;
}

#footer{
    position:fixed;
    right:10px;
    bottom:10px;
    background:#222;
    color:white;
    padding:8px 12px;
    border-radius:5px;
    font-family:monospace;
}

</style>

<script>

window.onerror = function(message, source, line){

    document.body.insertAdjacentHTML(
        "afterbegin",
        `
        <div style="
            background:#ffdddd;
            border:2px solid red;
            padding:10px;
            margin:10px;">
            <b>JavaScript Error</b><br>
            ${message}<br>
            Line: ${line}
        </div>
        `
    );
};

</script>

</head>

<body>

<h1>
    Cricket Player Database
    <span class="version">v1.6</span>
</h1>

<p id="buildInfo"></p>

<div id="status">
    ⏳ Loading players.json...
</div>

<div id="stats"></div>

<div>

    <select id="teamFilter">
        <option value="">All Teams</option>
        <option value="1st XI">1st XI</option>
        <option value="2nd XI">2nd XI</option>
        <option value="3rd XI">3rd XI</option>
    </select>

    <input
        type="text"
        id="search"
        placeholder="Search players">

    <button onclick="exportCsv()">
        Export CSV
    </button>

</div>

<div id="recordCount"></div>

<div class="chartContainer">
    <h2>Top 10 Run Scorers</h2>
    <canvas id="runsChart"></canvas>
</div>

<div class="chartContainer">
    <h2>Top 10 Wicket Takers</h2>
    <canvas id="wicketsChart"></canvas>
</div>

<div class="chartContainer">
    <h2>Players Per Team</h2>
    <canvas id="teamChart"></canvas>
</div>

<table id="playersTable"></table>

<div id="popup"></div>

<div id="footer">
    CricketDB v1.6
</div>

<script>

const VERSION = "1.6";

document.getElementById("buildInfo").innerHTML =
    "Build " + VERSION +
    " | " +
    new Date().toLocaleString();

let players = [];
let filteredPlayers = [];
let sortAscending = true;

document
    .getElementById("search")
    .addEventListener("input", filterPlayers);

document
    .getElementById("teamFilter")
    .addEventListener("change", filterPlayers);

fetch("players.json")

.then(response => {

    if(!response.ok){

        throw new Error(
            "players.json not found (HTTP " +
            response.status + ")"
        );
    }

    return response.json();

})

.then(data => {

    players = data;
    filteredPlayers = [...players];

    document.getElementById("status")
        .className = "success";

    document.getElementById("status")
        .innerHTML =
        "✅ Loaded " +
        players.length +
        " players";

    buildStats();
    renderTable(players);

    if(typeof Chart !== "undefined"){

        buildRunsChart();
        buildWicketsChart();
        buildTeamChart();

    }

})

.catch(error => {

    document.getElementById("status")
        .className = "error";

    document.getElementById("status")
        .innerHTML =
        "❌ " + error.message;

});

function buildStats(){

    const totalRuns =
        players.reduce((a,b)=>a+b.runs,0);

    const totalWickets =
        players.reduce((a,b)=>a+b.wickets,0);

    const topScorer =
        players.reduce(
            (a,b)=>
            a.runs > b.runs ? a : b
        );

    document.getElementById("stats").innerHTML = `

        <div class="card">
            <h3>Players</h3>
            ${players.length}
        </div>

        <div class="card">
            <h3>Total Runs</h3>
            ${totalRuns}
        </div>

        <div class="card">
            <h3>Total Wickets</h3>
            ${totalWickets}
        </div>

        <div class="card">
            <h3>Top Scorer</h3>
            ${topScorer.name}
        </div>

    `;
}

function renderTable(data){

    document.getElementById("recordCount")
        .innerHTML =
        data.length + " player(s) found";

    let html = `
    <tr>
        <th onclick="sortBy('name')">Name</th>
        <th onclick="sortBy('team')">Team</th>
        <th onclick="sortBy('runs')">Runs</th>
        <th onclick="sortBy('wickets')">Wickets</th>
        <th>View</th>
    </tr>`;

    data.forEach(player => {

        html += `
        <tr>
            <td>${player.name}</td>
            <td>${player.team}</td>
            <td>${player.runs}</td>
            <td>${player.wickets}</td>
            <td>
                <button onclick="showPlayer(${player.id})">
                    View
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("playersTable")
        .innerHTML = html;
}

function filterPlayers(){

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const team =
        document.getElementById("teamFilter")
        .value;

    filteredPlayers = players.filter(player => {

        const matchSearch =

            player.name.toLowerCase().includes(search) ||
            player.team.toLowerCase().includes(search) ||
            player.runs.toString().includes(search) ||
            player.wickets.toString().includes(search);

        const matchTeam =
            team === "" ||
            player.team === team;

        return matchSearch && matchTeam;

    });

    renderTable(filteredPlayers);
}

function sortBy(column){

    sortAscending = !sortAscending;

    filteredPlayers.sort((a,b)=>{

        if(typeof a[column] === "string"){

            return sortAscending
                ? a[column].localeCompare(b[column])
                : b[column].localeCompare(a[column]);
        }

        return sortAscending
            ? a[column]-b[column]
            : b[column]-a[column];
    });

    renderTable(filteredPlayers);
}

function showPlayer(id){

    const p =
        players.find(
            x => x.id === id
        );

    document.getElementById("popup")
        .innerHTML = `

        <h2>${p.name}</h2>

        <p><b>Team:</b> ${p.team}</p>
        <p><b>Runs:</b> ${p.runs}</p>
        <p><b>Wickets:</b> ${p.wickets}</p>

        <button onclick="closePopup()">
            Close
        </button>

    `;

    document.getElementById("popup")
        .style.display = "block";
}

function closePopup(){

    document.getElementById("popup")
        .style.display = "none";
}

function buildRunsChart(){

    const top10 =
        [...players]
        .sort((a,b)=>b.runs-a.runs)
        .slice(0,10);

    new Chart(
        document.getElementById("runsChart"),
        {
            type:"bar",
            data:{
                labels:
                    top10.map(x=>x.name),
                datasets:[{
                    label:"Runs",
                    backgroundColor:"#7b1831",
                    data:
                        top10.map(x=>x.runs)
                }]
            }
        }
    );
}

function buildWicketsChart(){

    const top10 =
        [...players]
        .sort((a,b)=>b.wickets-a.wickets)
        .slice(0,10);

    new Chart(
        document.getElementById("wicketsChart"),
        {
            type:"bar",
            data:{
                labels:
                    top10.map(x=>x.name),
                datasets:[{
                    label:"Wickets",
                    backgroundColor:"#00509d",
                    data:
                        top10.map(x=>x.wickets)
                }]
            }
        }
    );
}

function buildTeamChart(){

    const counts = {

        "1st XI": players.filter(x=>x.team==="1st XI").length,
        "2nd XI": players.filter(x=>x.team==="2nd XI").length,
        "3rd XI": players.filter(x=>x.team==="3rd XI").length

    };

    new Chart(
        document.getElementById("teamChart"),
        {
            type:"pie",
            data:{
                labels:Object.keys(counts),
                datasets:[{
                    data:Object.values(counts),
                    backgroundColor:[
                        "#7b1831",
                        "#00509d",
                        "#6c757d"
                    ]
                }]
            }
        }
    );
}

function exportCsv(){

    let csv =
        "Name,Team,Runs,Wickets\n";

    filteredPlayers.forEach(player => {

        csv +=
            `"${player.name}","${player.team}",${player.runs},${player.wickets}\n`;

    });

    const blob =
        new Blob([csv],
        {type:"text/csv"});

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;
    link.download =
        "cricket_players.csv";

    link.click();

    URL.revokeObjectURL(url);
}

console.log("CricketDB v1.6");

</script>

</body>
</html>
