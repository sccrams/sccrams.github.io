<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cricket Database v1.8</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:20px;
}

.version{
    background:#d62828;
    color:white;
    padding:5px 10px;
    border-radius:5px;
}

#status{
    padding:10px;
    margin-bottom:15px;
    border-radius:5px;
    background:#d4edda;
}

#stats{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

.card{
    flex:1;
    min-width:160px;
    background:white;
    padding:15px;
    border-radius:8px;
    box-shadow:0 2px 4px #ccc;
}

input,select,button{
    padding:8px;
    margin:5px;
}

.chartBox{
    background:white;
    padding:15px;
    margin:20px 0;
    border-radius:8px;
    box-shadow:0 2px 4px #ccc;
}

.barRow{
    margin:8px 0;
}

.barLabel{
    display:inline-block;
    width:180px;
}

.bar{
    display:inline-block;
    height:20px;
    background:#8b1538;
}

.wicketBar{
    background:#0059b3;
}

.pieContainer{
    display:flex;
    align-items:center;
    gap:30px;
    flex-wrap:wrap;
}

.pie{
    width:220px;
    height:220px;
    border-radius:50%;
}

.tableContainer{
    max-height:600px;
    overflow-y:auto;
    background:white;
    border-radius:8px;
    box-shadow:0 2px 4px #ccc;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#8b1538;
    color:white;
    position:sticky;
    top:0;
    z-index:10;
}

th,td{
    padding:5px 8px;
    border:1px solid #ddd;
    font-size:12px;
}

tr:nth-child(even){
    background:#f8f8f8;
}

tr:hover{
    background:#eef5ff;
}

#popup{
    display:none;
    position:fixed;
    top:20%;
    left:50%;
    transform:translateX(-50%);
    width:320px;
    background:white;
    border:2px solid #333;
    padding:20px;
    box-shadow:0 0 20px #333;
}

#footer{
    position:fixed;
    bottom:10px;
    right:10px;
    background:#222;
    color:white;
    padding:8px;
    border-radius:5px;
    font-family:monospace;
}

.legendItem{
    margin:8px 0;
    font-size:14px;
}

</style>

</head>

<body>

<h1>
    Cricket Player Database
    <span class="version">v1.8</span>
</h1>

<p id="buildInfo"></p>

<div id="status">
    Loading players.json...
</div>

<div id="stats"></div>

<div>

    <select id="teamFilter">
        <option value="">All Teams</option>
        <option value="1st XI">1st XI</option>
        <option value="2nd XI">2nd XI</option>
        <option value="3rd XI">3rd XI</option>
    </select>

    <input
        type="text"
        id="search"
        placeholder="Search players">

    <button onclick="exportCsv()">
        Export CSV
    </button>

</div>

<div id="recordCount"></div>

<div class="chartBox">

    <h2>Top 10 Run Scorers</h2>

    <div id="runsChart"></div>

</div>

<div class="chartBox">

    <h2>Top 10 Wicket Takers</h2>

    <div id="wicketsChart"></div>

</div>

<div class="chartBox">

    <h2>Players Per Team</h2>

    <div class="pieContainer">

        <div id="teamPie"></div>

        <div id="teamLegend"></div>

    </div>

</div>

<div class="tableContainer">
    <table id="playersTable"></table>
</div>

<div id="popup"></div>

<div id="footer">
    CricketDB v1.8
</div>

<script>

const VERSION = "1.8";

let players = [];
let filteredPlayers = [];
let sortAscending = true;

document.getElementById("buildInfo").innerHTML =
    "Build " + VERSION +
    " | " +
    new Date().toLocaleString();

document
    .getElementById("search")
    .addEventListener("input", filterPlayers);

document
    .getElementById("teamFilter")
    .addEventListener("change", filterPlayers);

fetch("players.json")

.then(response => {

    if(!response.ok){

        throw new Error(
            "players.json not found"
        );

    }

    return response.json();

})

.then(data => {

    players = data;
    filteredPlayers = [...players];

    document.getElementById("status").innerHTML =
        "✅ Loaded " +
        players.length +
        " players";

    buildStats();
    buildRunsChart();
    buildWicketsChart();
    buildTeamChart();

    renderTable(players);

})

.catch(error => {

    document.getElementById("status").innerHTML =
        "❌ " + error.message;

});

function buildStats(){

    const totalRuns =
        players.reduce((a,b)=>a+b.runs,0);

    const totalWickets =
        players.reduce((a,b)=>a+b.wickets,0);

    const topScorer =
        players.reduce((a,b)=>
            a.runs>b.runs?a:b);

    document.getElementById("stats").innerHTML =

    `
    <div class="card">
        <h3>Players</h3>
        ${players.length}
    </div>

    <div class="card">
        <h3>Total Runs</h3>
        ${totalRuns}
    </div>

    <div class="card">
        <h3>Total Wickets</h3>
        ${totalWickets}
    </div>

    <div class="card">
        <h3>Top Scorer</h3>
        ${topScorer.name}
    </div>
    `;
}

function renderTable(data){

    document.getElementById("recordCount").innerHTML =
        `Showing ${data.length} of ${players.length} players`;

    let html = `
    <tr>
        <th>#</th>
        <th onclick="sortBy('name')">Name</th>
        <th onclick="sortBy('team')">Team</th>
        <th onclick="sortBy('runs')">Runs</th>
        <th onclick="sortBy('wickets')">Wickets</th>
        <th>View</th>
    </tr>`;

    data.forEach((player,index)=>{

        html += `
        <tr>
            <td>${index+1}</td>
            <td>${player.name}</td>
            <td>${player.team}</td>
            <td>${player.runs}</td>
            <td>${player.wickets}</td>
            <td>
                <button onclick="showPlayer(${player.id})">
                    View
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("playersTable")
        .innerHTML = html;
}

function filterPlayers(){

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const team =
        document.getElementById("teamFilter")
        .value;

    filteredPlayers = players.filter(player => {

        const searchMatch =

            player.name.toLowerCase().includes(search) ||
            player.team.toLowerCase().includes(search) ||
            player.runs.toString().includes(search) ||
            player.wickets.toString().includes(search);

        const teamMatch =
            team === "" ||
            player.team === team;

        return searchMatch && teamMatch;

    });

    renderTable(filteredPlayers);
}

function sortBy(column){

    sortAscending = !sortAscending;

    filteredPlayers.sort((a,b)=>{

        if(typeof a[column] === "string"){

            return sortAscending
                ? a[column].localeCompare(b[column])
                : b[column].localeCompare(a[column]);
        }

        return sortAscending
            ? a[column]-b[column]
            : b[column]-a[column];
    });

    renderTable(filteredPlayers);
}

function showPlayer(id){

    const player =
        players.find(
            p=>p.id===id
        );

    document.getElementById("popup").innerHTML =

    `
    <h2>${player.name}</h2>

    <p><b>Team:</b> ${player.team}</p>
    <p><b>Runs:</b> ${player.runs}</p>
    <p><b>Wickets:</b> ${player.wickets}</p>

    <button onclick="closePopup()">
        Close
    </button>
    `;

    document.getElementById("popup")
        .style.display = "block";
}

function closePopup(){

    document.getElementById("popup")
        .style.display = "none";
}

function buildRunsChart(){

    const top =
        [...players]
        .sort((a,b)=>b.runs-a.runs)
        .slice(0,10);

    let html = "";

    top.forEach(player=>{

        html += `
        <div class="barRow">

            <span class="barLabel">
                ${player.name}
            </span>

            <div
                class="bar"
                style="width:${player.runs/2}px">
            </div>

            ${player.runs}

        </div>`;
    });

    document.getElementById("runsChart")
        .innerHTML = html;
}

function buildWicketsChart(){

    const top =
        [...players]
        .sort((a,b)=>b.wickets-a.wickets)
        .slice(0,10);

    let html = "";

    top.forEach(player=>{

        html += `
        <div class="barRow">

            <span class="barLabel">
                ${player.name}
            </span>

            <div
                class="bar wicketBar"
                style="width:${player.wickets*15}px">
            </div>

            ${player.wickets}

        </div>`;
    });

    document.getElementById("wicketsChart")
        .innerHTML = html;
}

function buildTeamChart(){

    const first =
        players.filter(
            p=>p.team==="1st XI"
        ).length;

    const second =
        players.filter(
            p=>p.team==="2nd XI"
        ).length;

    const third =
        players.filter(
            p=>p.team==="3rd XI"
        ).length;

    const total =
        players.length;

    const firstPct =
        Math.round((first/total)*100);

    const secondPct =
        Math.round((second/total)*100);

    const thirdPct =
        100 -
        firstPct -
        secondPct;

    document.getElementById("teamPie").innerHTML =

    `
    <div
        class="pie"
        style="
            background:
            conic-gradient(
                #8b1538 0% ${firstPct}%,
                #0059b3 ${firstPct}% ${firstPct + secondPct}%,
                #777 ${firstPct + secondPct}% 100%
            );
        ">
    </div>
    `;

    document.getElementById("teamLegend").innerHTML =

    `
    <div class="legendItem">
        🟥 1st XI: ${first}
    </div>

    <div class="legendItem">
        🟦 2nd XI: ${second}
    </div>

    <div class="legendItem">
        ⬜ 3rd XI: ${third}
    </div>

    <div class="legendItem">
        Total Players: ${total}
    </div>
    `;
}

function exportCsv(){

    let csv =
        "Name,Team,Runs,Wickets\n";

    filteredPlayers.forEach(player=>{

        csv +=
            `"${player.name}","${player.team}",${player.runs},${player.wickets}\n`;

    });

    const blob =
        new Blob(
            [csv],
            {
                type:"text/csv"
            });

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "cricket_players.csv";

    link.click();
}

</script>

</body>
</html>
