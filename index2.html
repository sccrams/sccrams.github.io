<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cricket Database v1.7</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:20px;
}

.version{
    background:#d62828;
    color:white;
    padding:5px 10px;
    border-radius:5px;
}

#status{
    padding:10px;
    margin-bottom:15px;
    border-radius:5px;
    background:#d4edda;
}

.card{
    display:inline-block;
    background:white;
    padding:15px;
    width:180px;
    margin:5px;
    border-radius:8px;
    box-shadow:0 2px 4px #ccc;
}

input,select,button{
    padding:8px;
    margin:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:10px;
}

th{
    background:#7b1831;
    color:white;
    cursor:pointer;
}

th,td{
    padding:10px;
    border:1px solid #ddd;
}

tr:hover{
    background:#f0f8ff;
}

.chartBox{
    background:white;
    padding:15px;
    margin:20px 0;
    border-radius:8px;
    box-shadow:0 2px 4px #ccc;
}

.barRow{
    margin:8px 0;
}

.barLabel{
    display:inline-block;
    width:180px;
}

.bar{
    display:inline-block;
    height:20px;
    background:#7b1831;
}

.wicketBar{
    background:#00509d;
}

#popup{
    display:none;
    position:fixed;
    top:20%;
    left:50%;
    transform:translateX(-50%);
    width:320px;
    background:white;
    border:2px solid #333;
    padding:20px;
    box-shadow:0 0 20px #333;
}

#footer{
    position:fixed;
    bottom:10px;
    right:10px;
    background:#222;
    color:white;
    padding:8px;
    border-radius:5px;
    font-family:monospace;
}

</style>

</head>

<body>

<h1>
    Cricket Player Database
    <span class="version">v1.7</span>
</h1>

<p id="buildInfo"></p>

<div id="status">
    Loading players.json...
</div>

<div id="stats"></div>

<select id="teamFilter">
    <option value="">All Teams</option>
    <option value="1st XI">1st XI</option>
    <option value="2nd XI">2nd XI</option>
    <option value="3rd XI">3rd XI</option>
</select>

<input
    type="text"
    id="search"
    placeholder="Search players">

<button onclick="exportCsv()">
    Export CSV
</button>

<div id="recordCount"></div>

<div class="chartBox">
    <h2>Top 10 Run Scorers</h2>
    <div id="runsChart"></div>
</div>

<div class="chartBox">
    <h2>Top 10 Wicket Takers</h2>
    <div id="wicketsChart"></div>
</div>

<div class="chartBox">
    <h2>Players Per Team</h2>
    <div id="teamChart"></div>
</div>

<table id="playersTable"></table>

<div id="popup"></div>

<div id="footer">
    CricketDB v1.7
</div>

<script>

const VERSION = "1.7";

let players = [];
let filteredPlayers = [];
let sortAscending = true;

document.getElementById("buildInfo").innerText =
    "Build " + VERSION + " | " +
    new Date().toLocaleString();

document
    .getElementById("search")
    .addEventListener("input", filterPlayers);

document
    .getElementById("teamFilter")
    .addEventListener("change", filterPlayers);

fetch("players.json")

.then(response => {

    if(!response.ok){
        throw new Error(
            "players.json not found"
        );
    }

    return response.json();

})

.then(data => {

    players = data;
    filteredPlayers = [...players];

    document.getElementById("status").innerHTML =
        "✅ Loaded " +
        players.length +
        " players";

    buildStats();
    buildRunsChart();
    buildWicketsChart();
    buildTeamChart();

    renderTable(players);

})

.catch(error => {

    document.getElementById("status").innerHTML =
        "❌ " + error.message;

});

function buildStats(){

    const totalRuns =
        players.reduce((a,b)=>a+b.runs,0);

    const totalWickets =
        players.reduce((a,b)=>a+b.wickets,0);

    const topScorer =
        players.reduce((a,b)=>
            a.runs>b.runs?a:b);

    document.getElementById("stats").innerHTML =

    `
    <div class="card">
        <h3>Players</h3>
        ${players.length}
    </div>

    <div class="card">
        <h3>Total Runs</h3>
        ${totalRuns}
    </div>

    <div class="card">
        <h3>Total Wickets</h3>
        ${totalWickets}
    </div>

    <div class="card">
        <h3>Top Scorer</h3>
        ${topScorer.name}
    </div>
    `;
}

function renderTable(data){

    document.getElementById("recordCount").innerHTML =
        data.length + " player(s) found";

    let html = `
    <tr>
        <th onclick="sortBy('name')">Name</th>
        <th onclick="sortBy('team')">Team</th>
        <th onclick="sortBy('runs')">Runs</th>
        <th onclick="sortBy('wickets')">Wickets</th>
        <th>View</th>
    </tr>`;

    data.forEach(player => {

        html += `
        <tr>
            <td>${player.name}</td>
            <td>${player.team}</td>
            <td>${player.runs}</td>
            <td>${player.wickets}</td>
            <td>
                <button onclick="showPlayer(${player.id})">
                    View
                </button>
            </td>
        </tr>`;
    });

    document.getElementById("playersTable").innerHTML =
        html;
}

function filterPlayers(){

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    const team =
        document.getElementById("teamFilter")
        .value;

    filteredPlayers = players.filter(player => {

        const searchMatch =

            player.name.toLowerCase().includes(search) ||
            player.team.toLowerCase().includes(search) ||
            player.runs.toString().includes(search) ||
            player.wickets.toString().includes(search);

        const teamMatch =
            team === "" ||
            player.team === team;

        return searchMatch && teamMatch;

    });

    renderTable(filteredPlayers);
}

function sortBy(column){

    sortAscending = !sortAscending;

    filteredPlayers.sort((a,b)=>{

        if(typeof a[column] === "string"){

            return sortAscending
                ? a[column].localeCompare(b[column])
                : b[column].localeCompare(a[column]);
        }

        return sortAscending
            ? a[column]-b[column]
            : b[column]-a[column];
    });

    renderTable(filteredPlayers);
}

function showPlayer(id){

    const p =
        players.find(x=>x.id===id);

    document.getElementById("popup").innerHTML =

    `
    <h2>${p.name}</h2>

    <p><b>Team:</b> ${p.team}</p>
    <p><b>Runs:</b> ${p.runs}</p>
    <p><b>Wickets:</b> ${p.wickets}</p>

    <button onclick="closePopup()">
        Close
    </button>
    `;

    document.getElementById("popup")
        .style.display = "block";
}

function closePopup(){

    document.getElementById("popup")
        .style.display = "none";
}

function buildRunsChart(){

    const top =
        [...players]
        .sort((a,b)=>b.runs-a.runs)
        .slice(0,10);

    let html = "";

    top.forEach(player=>{

        html += `
        <div class="barRow">
            <span class="barLabel">
                ${player.name}
            </span>

            <div
                class="bar"
                style="width:${player.runs/2}px">
            </div>

            ${player.runs}
        </div>`;
    });

    document.getElementById("runsChart")
        .innerHTML = html;
}

function buildWicketsChart(){

    const top =
        [...players]
        .sort((a,b)=>b.wickets-a.wickets)
        .slice(0,10);

    let html = "";

    top.forEach(player=>{

        html += `
        <div class="barRow">
            <span class="barLabel">
                ${player.name}
            </span>

            <div
                class="bar wicketBar"
                style="width:${player.wickets*15}px">
            </div>

            ${player.wickets}
        </div>`;
    });

    document.getElementById("wicketsChart")
        .innerHTML = html;
}

function buildTeamChart(){

    const first =
        players.filter(x=>x.team==="1st XI").length;

    const second =
        players.filter(x=>x.team==="2nd XI").length;

    const third =
        players.filter(x=>x.team==="3rd XI").length;

    document.getElementById("teamChart").innerHTML =
    `
    <p>1st XI: ${first}</p>
    <p>2nd XI: ${second}</p>
    <p>3rd XI: ${third}</p>
    `;
}

function exportCsv(){

    let csv =
        "Name,Team,Runs,Wickets\n";

    filteredPlayers.forEach(player=>{

        csv +=
            `"${player.name}","${player.team}",${player.runs},${player.wickets}\n`;
    });

    const blob =
        new Blob([csv],
        {type:"text/csv"});

    const link =
        document.createElement("a");

    link.href =
        URL.createObjectURL(blob);

    link.download =
        "cricket_players.csv";

    link.click();
}

</script>

</body>
</html>
