<!DOCTYPE html>
<html>
<H1>Test Start</H1>
<body>
    <div id="results"></div>

    <script>
        fetch('players.json')
            .then(response => response.json())
            .then(data => {
                let output = '';

                data.forEach(person => {
                    output += `
                        <p>
                            ${person.id} -
                            ${person.name} -
                            ${person.role}
                        </p>`;
                });

                document.getElementById('results').innerHTML = output;
            });
    </script>
<H1>Test End</H1>    
</body>
</html>
