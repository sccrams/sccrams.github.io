<!DOCTYPE html>
<html>
<head>

<title>Cricket Database v1.1</title>

<style>

body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f5f5;
}

h1 {
    color: #7b1831;
}

.card {
    display: inline-block;
    background: white;
    margin: 5px;
    padding: 15px;
    border-radius: 8px;
    box-shadow: 0 2px 5px #ccc;
    min-width: 150px;
}

input {
    padding: 10px;
    width: 300px;
    margin: 15px 0;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

th {
    background: #7b1831;
    color: white;
    cursor: pointer;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
}

tr:hover {
    background: #f0f8ff;
}

#popup {
    display: none;
    position: fixed;
    top: 20%;
    left: 35%;
    width: 300px;
    background: white;
    border: 2px solid #444;
    padding: 20px;
    box-shadow: 0 0 15px #444;
}

#recordCount {
    margin-bottom: 10px;
    font-weight: bold;
}

</style>

</head>
<body>

<h1>Cricket Player Database v1.1</h1>

<div id="stats"></div>

<input
    type="text"
    id="search"
    placeholder="Search players, teams, runs, wickets">

<div id="recordCount"></div>

<table id="playersTable"></table>

<div id="popup"></div>

<script>

let players = [];
let filteredPlayers = [];
let sortDirection = 1;

fetch("players.json")
.then(response => response.json())
.then(data => {

    console.log("Data Loaded:", data);

    players = data;
    filteredPlayers = [...players];

    buildStats();
    renderTable(filteredPlayers);

})
.catch(error => {

    console.error(error);

    document.body.innerHTML +=
        "<h2 style='color:red'>Failed to load players.json</h2>";

});

document
    .getElementById("search")
    .addEventListener("input", filterPlayers);

function buildStats() {

    const totalRuns =
        players.reduce((a,b) => a + b.runs, 0);

    const totalWickets =
        players.reduce((a,b) => a + b.wickets, 0);

    const topScorer =
        players.reduce((a,b) =>
            a.runs > b.runs ? a : b
        );

    document.getElementById("stats").innerHTML = `

        <div class="card">
            <h3>Players</h3>
            ${players.length}
        </div>

        <div class="card">
            <h3>Total Runs</h3>
            ${totalRuns}
        </div>

        <div class="card">
            <h3>Total Wickets</h3>
            ${totalWickets}
        </div>

        <div class="card">
            <h3>Top Scorer</h3>
            ${topScorer.name}
        </div>

    `;
}

    document.getElementById("recordCount")
        .innerText = `${data.length} player(s) found`;

            <th onclick="sortBy('runs')">Runs</th>
            <th onclick="sortBy('wickets')">Wickets</th>
            <th>Profile</th>
        </tr>
    `;
