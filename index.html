<!DOCTYPE html>
<html>

<head>

    <title>Cricket Database v1.2</title>

    <style>

        body{
            font-family:Arial,sans-serif;
            margin:20px;
            background:#f5f5f5;
        }

        .version{
            background:#d62828;
            color:white;
            padding:4px 10px;
            border-radius:5px;
            font-size:14px;
            vertical-align:middle;
        }

        .card{
            display:inline-block;
            background:white;
            padding:15px;
            margin:5px;
            border-radius:10px;
            box-shadow:0 2px 5px #ccc;
            width:180px;
        }

        input{
            width:300px;
            padding:10px;
            margin:15px 0;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#7b1831;
            color:white;
            cursor:pointer;
        }

        th,td{
            padding:10px;
            border:1px solid #ddd;
        }

        tr:hover{
            background:#f0f8ff;
        }

        #recordCount{
            font-weight:bold;
            margin-bottom:10px;
        }

        #status{
            margin-bottom:10px;
            color:#006400;
            font-weight:bold;
        }

        #popup{
            display:none;
            position:fixed;
            top:20%;
            left:50%;
            transform:translateX(-50%);
            width:320px;
            background:white;
            border:2px solid #333;
            padding:20px;
            box-shadow:0 0 20px #333;
        }

        #footerVersion{
            position:fixed;
            bottom:10px;
            right:10px;
            background:#222;
            color:white;
            padding:8px 12px;
            border-radius:5px;
            font-family:monospace;
        }

    </style>

</head>

<body>

<h1>
    Cricket Player Database
    <span class="version">v1.2</span>
</h1>

<div id="status">Loading...</div>

<div id="stats"></div>

<input
    type="text"
    id="search"
    placeholder="Search name, team, runs, wickets">

<div id="recordCount"></div>

<table id="playersTable"></table>

<div id="popup"></div>

<div id="footerVersion">
    CricketDB v1.2
</div>

<script>

const VERSION = "1.2";

let players = [];
let filteredPlayers = [];
let sortAscending = true;

fetch("players.json")
.then(response => response.json())
.then(data => {

    players = data;
    filteredPlayers = [...players];

    document.getElementById("status").innerHTML =
        "✅ Loaded " + players.length + " players";

    buildStats();
    renderTable(filteredPlayers);

})
.catch(error => {

    console.error(error);

    document.getElementById("status").innerHTML =
        "❌ Failed to load players.json";

});

document
    .getElementById("search")
    .addEventListener("input", filterPlayers);

function buildStats(){

    const totalRuns =
        players.reduce((sum,p) => sum + p.runs,0);

    const totalWickets =
        players.reduce((sum,p) => sum + p.wickets,0);

    const topScorer =
        players.reduce((a,b) =>
            a.runs > b.runs ? a : b);

    document.getElementById("stats").innerHTML = `

        <div class="card">
            <h3>Players</h3>
            ${players.length}
        </div>

        <div class="card">
            <h3>Total Runs</h3>
            ${totalRuns}
        </div>

        <div class="card">
            <h3>Total Wickets</h3>
            ${totalWickets}
        </div>

        <div class="card">
            <h3>Top Scorer</h3>
            ${topScorer.name}
        </div>

    `;
}

function renderTable(data){

    document.getElementById("recordCount").innerHTML =
        data.length + " player(s) found";

    let html = `
        <tr>
            <th onclick="sortBy('name')">Name</th>
            <th onclick="sortBy('team')">Team</th>
            <th onclick="sortBy('runs')">Runs</th>
            <th onclick="sortBy('wickets')">Wickets</th>
            <th>Profile</th>
        </tr>
    `;

    data.forEach(player => {

        html += `
            <tr>
                <td>${player.name}</td>
                <td>${player.team}</td>
                <td>${player.runs}</td>
                <td>${player.wickets}</td>
                <td>
                    <button onclick="showPlayer(${player.id})">
                        View
                    </button>
                </td>
            </tr>
        `;
    });

    document.getElementById("playersTable").innerHTML =
        html;
}

function filterPlayers(){

    const search =
        document.getElementById("search")
        .value
        .toLowerCase();

    filteredPlayers = players.filter(player =>

        player.name.toLowerCase().includes(search) ||
        player.team.toLowerCase().includes(search) ||
        player.runs.toString().includes(search) ||
        player.wickets.toString().includes(search)

    );

    renderTable(filteredPlayers);
}

function sortBy(column){

    sortAscending = !sortAscending;

    filteredPlayers.sort((a,b)=>{

        if(typeof a[column] === "string"){

            return sortAscending
                ? a[column].localeCompare(b[column])
                : b[column].localeCompare(a[column]);
        }

        return sortAscending
            ? a[column] - b[column]
            : b[column] - a[column];

    });

    renderTable(filteredPlayers);
}

function showPlayer(id){

    const p =
        players.find(player => player.id === id);

    document.getElementById("popup").innerHTML = `

        <h2>${p.name}</h2>

        <p><b>Team:</b> ${p.team}</p>

        <p><b>Runs:</b> ${p.runs}</p>

        <p><b>Wickets:</b> ${p.wickets}</p>

        <button onclick="closePopup()">
            Close
        </button>
    `;

    document.getElementById("popup").style.display = "block";
}

function closePopup(){

    document.getElementById("popup").style.display = "none";
}

console.log("Cricket DB Version " + VERSION);

</script>

</body>
</html>
