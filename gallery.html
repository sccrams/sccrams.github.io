<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #eee;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
    }

    #status {
      color: #aaa;
      margin-bottom: 20px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .gallery a {
      display: block;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 8px;
      background: #222;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }

    .gallery a:hover img {
      transform: scale(1.04);
    }

    .error {
      padding: 16px;
      border: 1px solid #633;
      border-radius: 8px;
      background: #2a1717;
      color: #fbb;
    }
  </style>
</head>
<body>
  <h1>Image Gallery</h1>
  <div id="status">Loading images…</div>
  <div id="gallery" class="gallery"></div>

  <script>
    /*
     * GitHub Pages does not provide directory listings, so images/
     * cannot be discovered by fetching "images/". Instead, this page
     * asks the GitHub API for the contents of the images directory.
     */
    const repoApi =
      "https://api.github.com/repos/sccrams/sccrams.github.io/contents/images";

    const imageExtensions =
      /\.(jpe?g|png|gif|webp|bmp|svg|avif|tiff?)$/i;

    async function loadGallery() {
      const status = document.getElementById("status");
      const gallery = document.getElementById("gallery");

      try {
        const response = await fetch(repoApi, {
          headers: {
            "Accept": "application/vnd.github+json"
          }
        });

        if (!response.ok) {
          throw new Error(`GitHub API returned HTTP ${response.status}`);
        }

        const files = await response.json();

        const images = files
          .filter(file => file.type === "file" && imageExtensions.test(file.name))
          .sort((a, b) => a.name.localeCompare(b.name, undefined, {
            numeric: true,
            sensitivity: "base"
          }));

        if (!images.length) {
          status.textContent = "No image files found in the images directory.";
          return;
        }

        for (const file of images) {
          const link = document.createElement("a");
          link.href = file.path;
          link.target = "_blank";
          link.rel = "noopener";

          const img = document.createElement("img");
          img.src = file.download_url;
          img.alt = file.name;
          img.loading = "lazy";

          link.appendChild(img);
          gallery.appendChild(link);
        }

        status.textContent =
          `${images.length} image${images.length === 1 ? "" : "s"}`;
      } catch (error) {
        console.error(error);
        status.innerHTML =
          '<div class="error">' +
          'Unable to load the images directory from GitHub.<br>' +
          '<small>' + error.message + '</small>' +
          '</div>';
      }
    }

    loadGallery();
  </script>
</body>
</html>
